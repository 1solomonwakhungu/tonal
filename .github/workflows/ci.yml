name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Registry Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shadcn registry outputs
        run: npm run registry:build

      - name: Verify compiled public/r/ manifests are up to date
        run: git diff --exit-code public/r/

      - name: Typecheck
        run: npm run typecheck

      - name: Run registry integrity tests
        run: npm test

      - name: Production Next.js build
        run: npm run build
